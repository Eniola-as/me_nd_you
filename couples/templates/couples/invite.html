{% extends "accounts/base.html" %}
{% block title %}Invitation{% endblock %}
{% block content %}
  <h1>Your invitation</h1>
  <p id="invite-status">Opening your invitation…</p>
  <noscript><p>Turn on JavaScript to open this invitation link.</p></noscript>
  <form id="invite-form" method="post" action="/invite/">
    {% csrf_token %}
    <input type="hidden" name="token" id="invite-token" />
  </form>
  <script>
    // The token is after "#", which the browser never sends to the server.
    // Drop it from the address bar and history, then post it.
    const token = location.hash.slice(1);
    history.replaceState(null, "", location.pathname);
    if (token) {
      document.getElementById("invite-token").value = token;
      document.getElementById("invite-form").submit();
    } else {
      document.getElementById("invite-status").textContent =
        "This invitation link is incomplete. Ask your partner to send it again.";
    }
  </script>
{% endblock %}
