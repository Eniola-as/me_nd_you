services:
  - type: web
    name: me_nd_you
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn me_nd_you.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Secret: set its value in the Render dashboard (Environment tab).
      # sync: false keeps it out of the repo. The old value is still in git
      # history, so it must be rotated, not just removed.
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: me-nd-you.onrender.com
      # No database variables yet: settings.py uses SQLite and never read the
      # old DB_* values. Add DATABASE_URL here when a managed database is chosen.
