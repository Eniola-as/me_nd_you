{% extends "accounts/email/base.html" %}
{% block content %}
  <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5">
    Hi {{ user.display_name|default:"there" }}, tap the link below to confirm this is your email. It works for 3 days.
  </p>
  <p style="margin: 0 0 20px"><a href="{{ link }}" style="display: inline-block; padding: 12px 22px; background: #ff4c61; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: bold">Confirm my email</a></p>
  <p style="margin: 0; font-size: 15px; line-height: 1.5">If you didn't create a Me &amp; You account, you can ignore this email.</p>
{% endblock %}
