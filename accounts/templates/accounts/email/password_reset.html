{% extends "accounts/email/base.html" %}
{% block content %}
  <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5">
    Someone asked to reset the password for this email. If it was you, tap the link within 1 hour:
  </p>
  <p style="margin: 0 0 20px"><a href="{{ link }}" style="display: inline-block; padding: 12px 22px; background: #ff4c61; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: bold">Reset my password</a></p>
  <p style="margin: 0; font-size: 15px; line-height: 1.5">If it wasn't you, ignore this email; your password stays the same.</p>
{% endblock %}
