<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Me & You</title>

    <link
      rel="manifest"
      href="{% static 'manifest.json' %}"
      crossorigin="use-credentials"
    />
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}" />
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}" />
    <meta name="theme-color" content="#e75480" />

    {% include "accounts/_font.html" %}
    <style>.beta-label{display:inline-block;margin-left:8px;padding:2px 8px;border:1px solid #f5c542;border-radius:999px;color:#f5c542;font-size:12px;font-weight:600;vertical-align:middle;}</style>

    <style>
      :root {
        --accent: #ff4c61;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100%;
        min-width: 0;
        font-family: "Outfit", sans-serif;
        background: #0d0d0d;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      .main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        padding: 0 8px;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 40px 30px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        margin-bottom: 28px;
        box-sizing: border-box;
      }

      .login-container svg {
        width: 48px;
        height: 48px;
        margin-bottom: 10px;
        fill: #ff4c61;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 25px;
        font-weight: 600;
        color: #ffffff;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ff4c61;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.3s ease;
        box-sizing: border-box;
      }

      button:hover,
      .button:hover {
        background: #ff6e7c;
      }

      .button {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ff4c61;
        color: white;
        font-size: 16px;
        text-align: center;
        text-decoration: none;
        border-radius: 12px;
        transition: background 0.3s ease;
        box-sizing: border-box;
      }

      .button.secondary {
        background: transparent;
        border: 2px solid #ff4c61;
        color: #ff4c61;
      }

      .button.secondary:hover {
        background: rgba(255, 76, 97, 0.12);
      }

      .tagline {
        color: #aaa;
        margin: 0 0 8px;
      }

      .pwa-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        padding: 0 8px;
      }

      .pwa-actions .install-guide {
        margin-top: 0;
      }

      #installBtn {
        background: linear-gradient(90deg, #ff4c61 60%, #ff7182 100%);
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      @media (max-width: 500px) {
        html,
        body {
          min-width: 0;
          width: 100%;
        }

        .main-content,
        .login-container,
        .pwa-actions {
          max-width: 100%;
          width: 100%;
        }

        .login-container {
          padding: 28px 20px;
        }

        h1 {
          font-size: 22px;
        }

        input,
        button {
          font-size: 15px;
        }
      }

      @media (min-width: 700px) {
        .main-content {
          max-width: 420px;
        }

        .login-container,
        .pwa-actions {
          max-width: 420px;
        }
      }

      .help-text {
        color: #aaa;
        font-size: 12px;
        margin-top: 4px;
        display: block;
      }

    </style>
  </head>
  <body>
    <div class="main-content">
      <div class="login-container">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                 2 6.5 3.5 5 5.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 
                 14.96 5 16.5 5 18.5 5 20 6.5 20 8.5c0 3.78-3.4 
                 6.86-8.55 11.54L12 21.35z"
          />
        </svg>

        <h1>Me & You <span class="beta-label">Beta</span></h1>

        <p class="tagline">A private game for the two of you.</p>
        <a class="button" href="/accounts/login/">Sign in</a>
        <a class="button secondary" href="/accounts/register/">Create account</a>
      </div>
      <div class="pwa-actions">
        {% include "accounts/_install_guide.html" %}
      </div>
    </div>

    {% include "accounts/_footer.html" %}

    {% include "accounts/_pwa.html" %}
  </body>
</html>
