<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <title>Let's Play – 3D Flip Card Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link
      rel="manifest"
      href="{% static 'manifest.json' %}"
      crossorigin="use-credentials"
    />
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}" />
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}" />
    <meta name="theme-color" content="#111111" />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0d0d;
        --glass: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #ff4c61;
        --accent-hover: #ff7182;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: "Outfit", sans-serif;
        background: var(--bg);
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h2 {
        margin: 10px 0 5px;
        color: var(--accent);
        font-size: 28px;
      }
      #mode-title {
        font-size: 16px;
        margin-bottom: 20px;
      }
      .flip-container {
        display: block;
        flex: none;
        padding: 0;
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        perspective: 1200px;
        width: 90%;
        max-width: 400px;
        height: 250px;
      }
      .flip-container:hover {
        background: none;
        color: inherit;
      }
      .flip-container:focus-visible {
        outline: 3px solid var(--accent-hover);
        outline-offset: 4px;
        border-radius: 16px;
      }
      .flipper {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      }
      .flip-container.flipped .flipper {
        transform: rotateY(180deg);
      }
      .side {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        border-radius: 16px;
        background: var(--glass);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-size: 20px;
        text-align: center;
        backface-visibility: hidden;
      }
      .back {
        background: var(--accent);
        color: #222;
        transform: rotateY(180deg);
      }
      .buttons {
        margin-top: 25px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        width: 100%;
        max-width: 400px;
      }
      button {
        flex: 1 1 120px;
        padding: 12px 16px;
        font-size: 16px;
        border-radius: 10px;
        background: var(--glass);
        border: 1px solid var(--accent);
        color: white;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: var(--accent-hover);
        color: #222;
      }
      dialog {
        background: var(--bg);
        color: white;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
        width: min(400px, 90vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.9);
      }
      #add-modal form {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      #add-modal textarea {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        font-size: 16px;
        border: none;
        resize: vertical;
        height: 80px;
      }
      #add-modal .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .close-btn {
        flex: none;
        background: none;
        border: none;
        color: #aaa;
        font-size: 20px;
        position: absolute;
        top: -15px;
        right: -10px;
        padding: 8px;
        cursor: pointer;
      }
      #guide-modal {
        text-align: center;
      }
      #guide-modal h3 {
        color: var(--accent);
        margin-bottom: 20px;
      }
      #guide-modal p {
        margin: 10px 0;
      }
      #turn-banner {
        font-size: 17px;
        font-weight: 600;
        color: #ff4c61;
        margin: 0 0 12px;
      }

      #card-kind {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #aaa;
        margin: 0 0 10px;
      }

      #add-modal fieldset {
        border: none;
        padding: 0;
        margin: 10px 0 0;
        display: flex;
        gap: 16px;
        color: #ddd;
      }

      #feedback {
        min-height: 1.4em;
        margin: 10px 0 0;
        color: #ddd;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h2>Let’s Play!</h2>
    <div id="mode-title">...loading</div>
    <p id="turn-banner" role="status" hidden></p>
    <p id="card-kind" hidden></p>

    <button
      type="button"
      class="flip-container"
      id="flip-container"
      aria-describedby="flip-hint"
    >
      <span class="flipper">
        <span class="side front" id="card-front">Loading...</span>
        <span class="side back" id="card-back" aria-hidden="true"></span>
      </span>
    </button>
    <p id="flip-hint" class="visually-hidden">Tap the card to flip it.</p>
    <p id="card-status" class="visually-hidden" role="status"></p>

    <div class="buttons">
      <button type="button" id="nextBtn">Next Question</button>
      <button type="button" id="truthBtn" hidden>Truth</button>
      <button type="button" id="dareBtn" hidden>Dare</button>
      <button type="button" id="skipBtn" hidden>Skip</button>
      <button type="button" id="switchBtn">Switch Mode</button>
      <button type="button" id="addBtn">Add Question</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>

    <p id="feedback" role="status"></p>

    <div
      id="remaining-counter"
      style="margin-top: 10px; font-size: 14px; color: #aaa"
    >
      Remaining: <span id="remaining-count">...</span>
    </div>

    <dialog id="add-modal" aria-labelledby="add-modal-title">
      <form onsubmit="submitQuestion(event)">
        <button
          type="button"
          class="close-btn"
          aria-label="Close"
          onclick="closeModal()"
        >✖</button>
        <label id="add-modal-title" for="new-question">Your question</label>
        <textarea
          id="new-question"
          placeholder="Write a question for you both..."
          required
        ></textarea>
        <fieldset id="new-kind-choice" hidden>
          <legend class="visually-hidden">Truth or dare?</legend>
          <input type="radio" name="new-kind" id="new-kind-truth" value="truth" checked />
          <label for="new-kind-truth">Truth</label>
          <input type="radio" name="new-kind" id="new-kind-dare" value="dare" />
          <label for="new-kind-dare">Dare</label>
        </fieldset>
        <div class="modal-buttons">
          <button type="submit">Add</button>
        </div>
      </form>
    </dialog>

    <dialog id="guide-modal" aria-labelledby="guide-title">
      <h3 id="guide-title">How to Play</h3>
      <p>1. Take turns reading questions</p>
      <p>2. Both partners must answer honestly</p>
      <p>3. Add your own questions anytime</p>
      <button type="button" onclick="closeGuide()">Got it!</button>
    </dialog>

    <script src="{% static 'js/socket-client.js' %}"></script>
    <script src="{% static 'js/room-client.js' %}"></script>
    <script src="{% static 'js/card.js' %}"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      // Truth or Dare plays in turns on its own room; other modes share a deck.
      const turnBased = mode === "truth";
      const game = turnBased ? "truth_or_dare" : "questions";

      function csrfToken() {
        const match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : "";
      }

      const container = document.getElementById("flip-container");
      const cardFront = document.getElementById("card-front");
      const cardBack = document.getElementById("card-back");
      const remainingCountSpan = document.getElementById("remaining-count");

      const card = createCard({
        container,
        front: cardFront,
        back: cardBack,
        status: document.getElementById("card-status"),
      });
      const feedback = document.getElementById("feedback");

      function showFeedback(message) {
        feedback.textContent = message;
      }
      const FINISHED_MESSAGE = "🎉 All questions finished. Click Reset.";

      // A tap also fires click, so one listener covers mouse and touch.
      container.addEventListener("click", () => card.flip());
      container.style.cursor = "pointer";

      document.getElementById("nextBtn").addEventListener("click", () => room.act("next"));
      document
        .getElementById("truthBtn")
        .addEventListener("click", () => room.act("choose", { kind: "truth" }));
      document
        .getElementById("dareBtn")
        .addEventListener("click", () => room.act("choose", { kind: "dare" }));
      document.getElementById("skipBtn").addEventListener("click", () => room.act("skip"));
      document.getElementById("switchBtn").addEventListener("click", () => {
        window.location.href = "/modes/";
      });
      document.getElementById("addBtn").addEventListener("click", openModal);
      document.getElementById("resetBtn").addEventListener("click", () => room.act("reset"));

      function openModal() {
        document.getElementById("add-modal").showModal();
      }

      function closeModal() {
        document.getElementById("add-modal").close();
      }

      function selectedKind() {
        return document.querySelector('input[name="new-kind"]:checked').value;
      }

      async function submitQuestion(e) {
        e.preventDefault();
        const text = document.getElementById("new-question").value.trim();
        if (!text) return;

        try {
          const res = await fetch("/api/space/custom-questions/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
            body: JSON.stringify(turnBased ? { text, mode, kind: selectedKind() } : { text, mode }),
          });

          if (res.ok) {
            // The server adds it to the shared deck for both partners.
            closeModal();
            showFeedback("✅ Question added.");
          } else {
            showFeedback("❌ Couldn't add your question. Please try again.");
          }
        } catch (err) {
          console.error("Error adding question:", err);
          showFeedback("❌ Couldn't add your question. Please try again.");
        }
      }

      // The server holds the deck and the current card; this page sends Next
      // and Reset requests and shows the state it receives.
      let shownKey = null;
      const room = createRoomClient({
        url: `${window.location.protocol === "https:" ? "wss:" : "ws:"}//${window.location.host}/ws/room/${game}/${encodeURIComponent(mode)}/`,
        onState: turnBased ? renderTurns : renderRoomState,
        onError(error) {
          if (error.reason === "forbidden") {
            showFeedback("You no longer have access to this couple space.");
          } else if (error.reason === "invalid" && error.detail) {
            showFeedback(error.detail);
          }
        },
      });

      function renderRoomState({ state }) {
        remainingCountSpan.textContent = state.remaining;
        if (state.finished) {
          shownKey = null;
          card.showMessage(FINISHED_MESSAGE);
        } else if (state.current && state.current.key !== shownKey) {
          shownKey = state.current.key;
          card.showQuestion(state.current.text);
        }
      }

      // Truth or Dare: the banner says whose turn it is (the first turn is a
      // random coin toss), and only the right player's buttons work. The
      // server checks all of this too.
      const truthBtn = document.getElementById("truthBtn");
      const dareBtn = document.getElementById("dareBtn");
      const skipBtn = document.getElementById("skipBtn");
      const turnBanner = document.getElementById("turn-banner");
      const cardKind = document.getElementById("card-kind");
      const KIND_LABELS = { truth: "Truth", dare: "Dare" };

      if (turnBased) {
        document.getElementById("nextBtn").hidden = true;
        for (const el of [truthBtn, dareBtn, skipBtn, turnBanner]) el.hidden = false;
        document.getElementById("new-kind-choice").hidden = false;
      }

      function renderTurns({ state, names }) {
        const partner = (names && names.partner) || "Your partner";
        remainingCountSpan.textContent = state.remaining;
        if (state.finished && !state.current) {
          turnBanner.textContent = "No cards left. Press Reset to play again.";
        } else if (state.finished) {
          turnBanner.textContent = "That was the last card. Press Reset to play again.";
        } else if (state.draws === 0) {
          turnBanner.textContent = state.first_turn_yours
            ? "Coin toss: you go first. Pick Truth or Dare."
            : `Coin toss: ${partner} goes first.`;
        } else {
          turnBanner.textContent = state.your_turn ? "Your turn: pick Truth or Dare." : `${partner}'s turn.`;
        }

        const current = state.current;
        if (!current) {
          shownKey = null;
          cardKind.hidden = true;
          card.showMessage(state.your_turn ? "Pick Truth or Dare to start." : `Waiting for ${partner} to pick.`);
        } else {
          const whose = state.drawn_by_you ? "Your" : `${partner}'s`;
          cardKind.textContent = `${whose} ${KIND_LABELS[current.kind]}`;
          cardKind.hidden = false;
          if (current.key !== shownKey) {
            shownKey = current.key;
            card.showQuestion(current.text);
          }
        }

        truthBtn.disabled = !state.your_turn || state.truths_left === 0;
        dareBtn.disabled = !state.your_turn || state.dares_left === 0;
        const kindLeft = current && (current.kind === "truth" ? state.truths_left : state.dares_left);
        skipBtn.disabled = !(current && state.drawn_by_you && kindLeft > 0);
      }

      const modeMap = {
        questions: "Questions",
        truth: "Truth or Dare",
        challenge: "Challenge",
        spicy: "Spicy Only",
        mixed: "Mixed Mode",
        would: "Would You Rather",
      };

      cardBack.textContent = modeMap[mode] || "Game Mode";
      document.getElementById("mode-title").textContent =
        modeMap[mode] || "Game Mode";

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register(
              "/static/service-worker.js",
              {
                scope: "/static/",
              }
            );
          } catch (err) {
            console.error("Service Worker registration failed:", err);
          }
        });
      }

      // Show guide on first visit
      function showGuide() {
        const hasSeenGuide = localStorage.getItem("hasSeenGuide");
        if (!hasSeenGuide) {
          document.getElementById("guide-modal").showModal();
          localStorage.setItem("hasSeenGuide", "true");
        }
      }

      function closeGuide() {
        document.getElementById("guide-modal").close();
      }

      // Add to initialization
      document.addEventListener("DOMContentLoaded", () => {
        room.connect();
        showGuide();
      });
    </script>
  </body>
</html>
