<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <title>Let's Play – 3D Flip Card Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link
      rel="manifest"
      href="{% static 'manifest.json' %}"
      crossorigin="use-credentials"
    />
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}" />
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}" />
    <meta name="theme-color" content="#111111" />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0d0d;
        --glass: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #ff4c61;
        --accent-hover: #ff7182;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: "Outfit", sans-serif;
        background: var(--bg);
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h2 {
        margin: 10px 0 5px;
        color: var(--accent);
        font-size: 28px;
      }
      #mode-title {
        font-size: 16px;
        margin-bottom: 20px;
      }
      .flip-container {
        display: block;
        flex: none;
        padding: 0;
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        perspective: 1200px;
        width: 90%;
        max-width: 400px;
        height: 250px;
      }
      .flip-container:hover {
        background: none;
        color: inherit;
      }
      .flip-container:focus-visible {
        outline: 3px solid var(--accent-hover);
        outline-offset: 4px;
        border-radius: 16px;
      }
      .flipper {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      }
      .flip-container.flipped .flipper {
        transform: rotateY(180deg);
      }
      .side {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        border-radius: 16px;
        background: var(--glass);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-size: 20px;
        text-align: center;
        backface-visibility: hidden;
      }
      .back {
        background: var(--accent);
        color: #222;
        transform: rotateY(180deg);
      }
      .buttons {
        margin-top: 25px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        width: 100%;
        max-width: 400px;
      }
      button {
        flex: 1 1 120px;
        padding: 12px 16px;
        font-size: 16px;
        border-radius: 10px;
        background: var(--glass);
        border: 1px solid var(--accent);
        color: white;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: var(--accent-hover);
        color: #222;
      }
      dialog {
        background: var(--bg);
        color: white;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
        width: min(400px, 90vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.9);
      }
      #add-modal form {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      #add-modal textarea {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        font-size: 16px;
        border: none;
        resize: vertical;
        height: 80px;
      }
      #add-modal .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .close-btn {
        flex: none;
        background: none;
        border: none;
        color: #aaa;
        font-size: 20px;
        position: absolute;
        top: -15px;
        right: -10px;
        padding: 8px;
        cursor: pointer;
      }
      #guide-modal {
        text-align: center;
      }
      #guide-modal h3 {
        color: var(--accent);
        margin-bottom: 20px;
      }
      #guide-modal p {
        margin: 10px 0;
      }
      #feedback {
        min-height: 1.4em;
        margin: 10px 0 0;
        color: #ddd;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h2>Let’s Play!</h2>
    <div id="mode-title">...loading</div>

    <button
      type="button"
      class="flip-container"
      id="flip-container"
      aria-describedby="flip-hint"
    >
      <span class="flipper">
        <span class="side front" id="card-front">Loading...</span>
        <span class="side back" id="card-back" aria-hidden="true"></span>
      </span>
    </button>
    <p id="flip-hint" class="visually-hidden">Tap the card to flip it.</p>
    <p id="card-status" class="visually-hidden" role="status"></p>

    <div class="buttons">
      <button type="button" id="nextBtn">Next Question</button>
      <button type="button" id="switchBtn">Switch Mode</button>
      <button type="button" id="addBtn">Add Question</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>

    <p id="feedback" role="status"></p>

    <div
      id="remaining-counter"
      style="margin-top: 10px; font-size: 14px; color: #aaa"
    >
      Remaining: <span id="remaining-count">...</span>
    </div>

    <dialog id="add-modal" aria-labelledby="add-modal-title">
      <form onsubmit="submitQuestion(event)">
        <button
          type="button"
          class="close-btn"
          aria-label="Close"
          onclick="closeModal()"
        >✖</button>
        <label id="add-modal-title" for="new-question">Your question</label>
        <textarea
          id="new-question"
          placeholder="Write a question for you both..."
          required
        ></textarea>
        <div class="modal-buttons">
          <button type="submit">Add</button>
        </div>
      </form>
    </dialog>

    <dialog id="guide-modal" aria-labelledby="guide-title">
      <h3 id="guide-title">How to Play</h3>
      <p>1. Take turns reading questions</p>
      <p>2. Both partners must answer honestly</p>
      <p>3. Add your own questions anytime</p>
      <button type="button" onclick="closeGuide()">Got it!</button>
    </dialog>

    <script src="{% static 'js/socket-client.js' %}"></script>
    <script src="{% static 'js/room-client.js' %}"></script>
    <script src="{% static 'js/game-messages.js' %}"></script>
    <script src="{% static 'js/card.js' %}"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      const secret = params.get("secret");
      const urlSeed = params.get("seed");
      const roomName = secret;
      // Signed-in members of a couple play in their private space: the
      // server finds the couple from the session, so no secret is used.
      const inSpace = {{ in_space|yesno:"true,false" }};
      const useSpace = inSpace && !secret;
      if (!useSpace && !secret) window.location.href = "/";

      function storageKey() {
        return useSpace ? `space-${mode}` : `session-${secret}-${mode}`;
      }

      function csrfToken() {
        const match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : "";
      }

      const container = document.getElementById("flip-container");
      const cardFront = document.getElementById("card-front");
      const cardBack = document.getElementById("card-back");
      const remainingCountSpan = document.getElementById("remaining-count");

      let questions = [],
        seenTexts = [],
        remaining = [],
        seed = urlSeed ? parseInt(urlSeed) : null;

      const myUserId = Math.random().toString(36).substr(2, 9);
      // The question on this page's card, shared when the partner syncs.
      let currentQuestionText = null;
      // Sync rules: adopt the partner's question after (re)connecting, unless
      // this page pressed Next or Reset while offline (that question is
      // queued and reaches the partner on reconnect) or since connecting.
      let ownQuestionPending = false;
      let acceptSync = false;

      const card = createCard({
        container,
        front: cardFront,
        back: cardBack,
        status: document.getElementById("card-status"),
      });
      const feedback = document.getElementById("feedback");

      function showFeedback(message) {
        feedback.textContent = message;
      }
      const FINISHED_MESSAGE = "🎉 All questions finished. Click Reset.";

      // A tap also fires click, so one listener covers mouse and touch.
      container.addEventListener("click", () => card.flip());
      container.style.cursor = "pointer";

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function shuffle(array, seed) {
        const rng = mulberry32(seed);
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function getWebSocketUrl() {
        try {
          const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          const host = window.location.host || "127.0.0.1:8000";
          const encodedRoom = encodeURIComponent(roomName || "");
          const encodedMode = encodeURIComponent(mode || "");
          return `${protocol}//${host}/ws/game/${encodedRoom}/${encodedMode}/`;
        } catch (err) {
          console.error("Error constructing WebSocket URL:", err);
          return null;
        }
      }

      function loadSession() {
        try {
          const key = storageKey();
          const saved = localStorage.getItem(key);
          if (saved) {
            const data = JSON.parse(saved);
            seenTexts = Array.isArray(data.seen) ? data.seen : [];
            seed = urlSeed ? parseInt(urlSeed) : data.seed || null;
          } else {
            // Initialize new session
            seenTexts = [];
            seed = urlSeed ? parseInt(urlSeed) : Date.now() % 1000000000;
            saveSession();
          }
        } catch (err) {
          console.error("Session load error:", err);
          seenTexts = [];
          seed = null;
        }
      }

      function saveSession() {
        const key = storageKey();
        localStorage.setItem(key, JSON.stringify({ seen: seenTexts, seed }));
      }

      // showFirst: show a question once loaded. announce: also send it to the
      // partner (only Next and Reset do; the first question on page load is
      // local, so a newly opened page can adopt the partner's question).
      async function loadQuestions({ showFirst = true, announce = false } = {}) {
        try {
          const res = await fetch(
            `/api/questions/${encodeURIComponent(mode)}/?secret=${encodeURIComponent(secret)}`
          );
          questions = await res.json();

          loadSession();

          if (!seed) {
            seed = Date.now() % 1000000000;
            saveSession();
          }

          shuffle(questions, seed);
          updateRemaining();

          if (!remaining.length) card.showMessage(FINISHED_MESSAGE);
          // A question already on the card (adopted from the partner, who may
          // have answered before this load finished) wins over a local pick.
          else if (showFirst && (announce || !currentQuestionText)) nextQuestion({ announce });
        } catch (err) {
          card.showMessage("⚠ Failed to load questions.");
          console.error("Fetch error:", err);
        }
      }

      function updateRemaining() {
        remaining = questions.filter((q) => !seenTexts.includes(q.text));
        remainingCountSpan.textContent = remaining.length;
      }

      function nextQuestion({ announce = true } = {}) {
        if (!remaining.length) {
          currentQuestionText = null;
          card.showMessage(FINISHED_MESSAGE);
          return;
        }

        const q1 = remaining.shift();
        seenTexts.push(q1.text);
        saveSession();
        updateRemaining();

        currentQuestionText = q1.text;
        card.showQuestion(q1.text);
        if (announce) {
          if (!socketClient.isOpen) ownQuestionPending = true;
          acceptSync = false;
          socketClient.send(GameMessages.question(myUserId, q1.text));
        }
      }

      function clearProgress(newSeed) {
        seenTexts = [];
        seed = newSeed;
        saveSession();
      }

      function resetSession() {
        clearProgress(Date.now() % 1000000000);
        socketClient.send(GameMessages.reset(myUserId, seed));
        loadQuestions({ announce: true });
      }

      // Add event listeners instead of inline onclick
      document
        .getElementById("nextBtn")
        .addEventListener("click", () => (useSpace ? room.act("next") : nextQuestion()));
      document.getElementById("switchBtn").addEventListener("click", () => {
        window.location.href = useSpace
          ? "/modes/"
          : `/modes/?secret=${encodeURIComponent(secret)}`;
      });
      document.getElementById("addBtn").addEventListener("click", openModal);
      document
        .getElementById("resetBtn")
        .addEventListener("click", () => (useSpace ? room.act("reset") : resetSession()));

      function openModal() {
        document.getElementById("add-modal").showModal();
      }

      function closeModal() {
        document.getElementById("add-modal").close();
      }

      async function submitQuestion(e) {
        e.preventDefault();
        const text = document.getElementById("new-question").value.trim();
        if (!text) return;

        try {
          const res = useSpace
            ? await fetch("/api/space/custom-questions/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
                body: JSON.stringify({ text, mode }),
              })
            : await fetch("/api/add-custom-question/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ secret, text, mode }),
              });

          if (res.ok) {
            const q = await res.json();
            // In a couple space the server adds it to the shared deck.
            if (!useSpace) {
              questions.push(q);
              remaining.push(q);
              updateRemaining();
            }
            closeModal();
            showFeedback("✅ Question added.");
          } else {
            showFeedback("❌ Couldn't add your question. Please try again.");
          }
        } catch (err) {
          console.error("Error adding question:", err);
          showFeedback("❌ Couldn't add your question. Please try again.");
        }
      }

      const socketClient = createSocketClient({
        url: getWebSocketUrl(),
        onOpen() {
          // After every (re)connection, catch up with the partner's question.
          acceptSync = !ownQuestionPending;
          ownQuestionPending = false;
          socketClient.send(GameMessages.syncRequest(myUserId));
        },
        onMessage(data) {
          // Malformed, unknown and this page's own messages come back as null.
          const message = GameMessages.parse(data, myUserId);
          if (!message) return;
          switch (message.type) {
            case "question":
              currentQuestionText = message.question;
              card.showQuestion(message.question);
              break;
            case "reset":
              // Start over too, then wait for the partner's first question.
              clearProgress(message.seed);
              loadQuestions({ showFirst: false });
              break;
            case "sync_request":
              socketClient.send(
                GameMessages.syncResponse(myUserId, seed, currentQuestionText)
              );
              break;
            case "sync_response":
              if (acceptSync && message.currentQuestion) {
                currentQuestionText = message.currentQuestion;
                card.showQuestion(message.currentQuestion);
              }
              break;
          }
        },
      });

      // Couple spaces: the server holds the deck and the current card; this
      // page sends Next and Reset requests and shows the state it receives.
      let shownKey = null;
      const room = useSpace
        ? createRoomClient({
            url: `${window.location.protocol === "https:" ? "wss:" : "ws:"}//${window.location.host}/ws/room/questions/${encodeURIComponent(mode)}/`,
            onState: renderRoomState,
            onError(error) {
              if (error.reason === "forbidden") {
                showFeedback("You no longer have access to this couple space.");
              } else if (error.reason === "invalid" && error.detail) {
                showFeedback(error.detail);
              }
            },
          })
        : null;

      function renderRoomState({ state }) {
        remainingCountSpan.textContent = state.remaining;
        if (state.finished) {
          shownKey = null;
          card.showMessage(FINISHED_MESSAGE);
        } else if (state.current && state.current.key !== shownKey) {
          shownKey = state.current.key;
          card.showQuestion(state.current.text);
        }
      }

      const modeMap = {
        questions: "Questions",
        truth: "Truth or Dare",
        challenge: "Challenge",
        spicy: "Spicy Only",
        mixed: "Mixed Mode",
        would: "Would You Rather",
      };

      cardBack.textContent = modeMap[mode] || "Game Mode";
      document.getElementById("mode-title").textContent =
        modeMap[mode] || "Game Mode";

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register(
              "/static/service-worker.js",
              {
                scope: "/static/",
              }
            );
          } catch (err) {
            console.error("Service Worker registration failed:", err);
          }
        });
      }

      // Show guide on first visit
      function showGuide() {
        const hasSeenGuide = localStorage.getItem("hasSeenGuide");
        if (!hasSeenGuide) {
          document.getElementById("guide-modal").showModal();
          localStorage.setItem("hasSeenGuide", "true");
        }
      }

      function closeGuide() {
        document.getElementById("guide-modal").close();
      }

      // Add to initialization
      document.addEventListener("DOMContentLoaded", () => {
        if (useSpace) {
          room.connect();
        } else {
          socketClient.connect();
          loadQuestions();
        }
        showGuide();
      });
    </script>
  </body>
</html>
