<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Me & You - Game Modes</title>

    <link
      rel="manifest"
      href="{% static 'manifest.json' %}"
      crossorigin="use-credentials"
    />
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}" />
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}" />
    <meta name="theme-color" content="#e75480" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    {% include "accounts/_font.html" %}

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        background: #0d0d0d;
        color: white;
        font-family: "Outfit", sans-serif;
        margin: 0;
        width: 100%;
        min-width: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h2 {
        font-size: 28px;
        color: #ff4c61;
        margin-bottom: 40px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
        gap: 20px;
        width: 100%;
        max-width: 600px;
        min-width: 0;
      }

      .mode-card {
        width: 100%;
        min-width: 0;
        color: white;
        font: inherit;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      /* Hover only with a mouse: on touch screens it sticks after a tap. */
      @media (hover: hover) {
        .mode-card:hover {
          transform: translateY(-4px);
          background: rgba(255, 76, 97, 0.15);
        }
      }
      .mode-card:focus-visible {
        transform: translateY(-4px);
        background: rgba(255, 76, 97, 0.15);
      }

      .mode-card svg {
        width: 36px;
        height: 36px;
        margin-bottom: 10px;
        fill: #ff4c61;
      }

      .mode-card span {
        display: block;
        font-size: 16px;
        font-weight: 600;
        color: white;
      }

      .mode-card .mode-note {
        margin-top: 4px;
        font-size: 13px;
        font-weight: 400;
        color: #aaa;
      }

      @media (max-width: 480px) {
        body {
          padding: 28px 16px;
        }
        h2 {
          margin-bottom: 24px;
          text-align: center;
        }
        .grid {
          gap: 12px;
        }
        .mode-card {
          padding: 16px 12px;
        }
      }
    </style>
  </head>
  <body>
    <h2>Select a Game Mode</h2>
    {% include "game/_mode_banner.html" %}

    <div class="grid">
      <button type="button" class="mode-card" data-mode="questions">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20 2H4c-1.1 0-2 .9-2 2v16l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"
          />
        </svg>
        <span>Questions</span>
        <span class="mode-note">Answer privately, reveal together</span>
      </button>
      <button type="button" class="mode-card" data-mode="truth">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C6.5 2 2 6.2 2 11c0 4 2.9 7.4 6.8 8.8L12 22l3.2-2.2C19.1 18.4 22 15 22 11c0-4.8-4.5-9-10-9zm0 15c-1.1 0-2-.9-2-2h4c0 1.1-.9 2-2 2zm2-4H10V7h4v6z"
          />
        </svg>
        <span>Truth or Dare</span>
      </button>
      <button type="button" class="mode-card" data-mode="challenge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2L2 20h20L12 2zm0 3.84L18.93 18H5.07L12 5.84zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"
          />
        </svg>
        <span>Challenge Mode</span>
      </button>
      <button type="button" class="mode-card" data-mode="spicy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M16 3c-1.5 0-2.7 1-3.2 2.4C11.9 4.4 10.5 3.5 9 3.5c-2.5 0-4.5 2-4.5 4.5S6.5 12.5 9 12.5c.7 0 1.4-.2 2-.6V13c0 2.8-2.2 5-5 5v2c4.4 0 8-3.6 8-8V6h2V3h-2z"
          />
        </svg>
        <span>Spicy Only</span>
      </button>
      <button type="button" class="mode-card" data-mode="mixed">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h2v2H7V7zm0 4h2v2H7v-2zm4-4h6v6h-6V7z"
          />
        </svg>
        <span>Mixed Mode</span>
      </button>
      <button type="button" class="mode-card" data-mode="would">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C8.1 2 5 5.1 5 9c0 4.4 4.1 7.9 6.7 10.2.8.7 2 .7 2.8 0C14.9 16.9 19 13.4 19 9c0-3.9-3.1-7-7-7zm0 16.3c-1.5-1.4-5-4.5-5-7.3 0-2.8 2.2-5 5-5s5 2.2 5 5c0 2.8-3.5 5.9-5 7.3z"
          />
        </svg>
        <span>Would You Rather</span>
      </button>
    </div>

    {% include "accounts/_footer.html" %}

    <script>
      document.querySelectorAll(".mode-card").forEach((card) => {
        card.addEventListener("click", () => {
          // Start or open the couple's mode, or ask the partner to switch.
          window.modeBanner.choose(card.dataset.mode);
        });
      });
    </script>
    {% include "accounts/_pwa.html" %}
    {% include "chat/_widget.html" with load_socket=True where="menu" %}
  </body>
</html>
